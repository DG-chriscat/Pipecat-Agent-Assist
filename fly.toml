# Deepgram Vitals on Fly.io (ADR 0004). Secrets: fly secrets, never this file.
app = "deepgram-vitals"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "python -m agent_assist_server.db migrate"
  strategy = "immediate"

[env]
  QUEUE_PERSIST = "1"
  SETTINGS_PERSIST = "1"
  AGENT_ASSIST_SERVER_URL = "http://127.0.0.1:8080"
  TRUSTED_CLIENT_IP_HEADER = "Fly-Client-IP"

[http_service]
  internal_port = 8080
  force_https = true
  # The queue is in memory (ADR in docs/queue.md): exactly one machine, and it must not
  # stop while a call is live. Fly stops it when no requests arrive for a few minutes.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-4x"
  memory = "4gb"
