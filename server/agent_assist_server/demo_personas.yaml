# Demo personas for the portal's Demos page (P5-10, docs/demos.md). Mock data only.
#
# Source of truth for the Demos page and the browser caller's script panel
# (/caller?persona=<key>). server/tests/test_demo_personas.py fails if a persona's
# name, DOB, member ID, plan, or claim does not match server/agent_assist_server/db/seed.py.
# `in_seed: false` marks the one caller who is deliberately not a member.
#
# Per persona: what to say to start (`start_line`), what the audience should see
# (`audience_sees`), the feature chips (`features`, vocabulary in demo_personas.py),
# and the step by step `script`: lines to say to the bot (intake answers) first, then
# lines to say to the agent to trigger the cards.

phone_line:
  number: "+1 (612) 746-7133"
  password_hint: ask Chris

