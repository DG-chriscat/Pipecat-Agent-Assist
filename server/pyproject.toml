[project]
name = "agent-assist-server"
version = "0.0.0"
description = "Deepgram Vitals server: dial-in, browser caller, queue, and agent API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32", "httpx>=0.27", "psycopg[binary]>=3.2", "itsdangerous>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_assist_server"]
