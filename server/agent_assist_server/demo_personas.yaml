# Demo personas for the portal's Demos page (P5-10, docs/demos.md). Mock data only.
#
# Source of truth for the Demos page and the browser caller page (/caller?persona=<key>).
# server/tests/test_demo_personas.py fails if a persona's name, DOB, member ID, plan, or
# claim does not match server/agent_assist_server/db/seed.py. `in_seed: false` marks the
# one caller who is deliberately not a member.
#
# Per persona: what to say to start (`start_line`), what the audience should see
# (`audience_sees`), the feature chips (`features`, vocabulary in demo_personas.py),
# and the caller talk track (P5-11).
#
# talk_track: the caller's side of the call, in call order. The agent is never
# scripted: the assist is the agent's script. Each beat:
#   phase     intake (to the bot), agent (the conversation), or closing
#   to        bot or agent
#   step      intake only: which bot question it answers (identity, confirm, reason,
#             claim_number, service_date, claim_concern, readback)
#   say       the main line
#   if_asked  up to three backup lines for likely questions
#   note      a hint for the caller (shown on the caller page too)
#   agent_note  for the tester only: what the agent should do (never on the caller page)
#   optional, feature  optional feature beats: tone_tip, ask_bar, verify
#   expect    what should show on the AGENT screen after the beat: {kind, text, id?}
#             kinds in demo_personas.EXPECT_KINDS. ids: hero nbs:<rule>:<record> or
#             verify:identity, card card:<template> or alert:<template>:<ids>, kb
#             article id, plan step id, ask (the record or article the Ask bar shows),
#             wrap_up (reason_code and refs, the reference numbers in the summary).
# server/tests/test_talk_tracks.py fails when an expect item names a rule, card, plan
# step, article, or reason code the packs or seed do not have, or a number in a line
# does not match the seed. The P5-10 `script` is derived from the non optional beats.
#
# Two rules from the P5-4 runs (docs/demo.md): say names plainly, never spelled to the
# bot (spelled names mid sentence were misheard), and the agent presses Accept on the
# hero before End (otherwise the wrap up has no logged action and the reason code
# falls back).

phone_line:
  number: "+1 (612) 746-7133"
  password_hint: ask Chris

personas:
  - key: maria_lopez
    name: Maria Lopez
    dob: "1984-03-12"
    dob_said: March twelfth, nineteen eighty four
    member_id: "418302"
    plan_id: PLN-HMO-SILVER
    claim_id: "70412"
    in_seed: true
    hero: true
    pack: claims_status
    case: MRI claim 70412 denied, missing prior authorization
    start_line: My MRI claim was denied and I don't know why.
    audience_sees:
      headline: Start a retro authorization review for 70412.
      cards: [Denied claim 70412 (CO-197), Call plan, Repeat caller badge, KB-CL-002 article]
    features: [identity_verified, repeat_caller, wrap_up]
    kb_articles: [KB-CL-002, KB-CL-009]
    talk_track:
      - phase: intake
        to: bot
        step: identity
        say: "My name is Maria Lopez. My date of birth is March twelfth, nineteen eighty four. My member ID is four one eight, three zero two."
        if_asked:
          - "If the bot asks for one detail again, say just that one, for example: My member ID is four one eight, three zero two."
        note: Say your name plainly. Do not spell it.
      - phase: intake
        to: bot
        step: confirm
        say: "Yes, that's right."
        if_asked:
          - "If the bot read the ID back wrong: No, my member ID is four one eight, three zero two."
      - phase: intake
        to: bot
        step: reason
        say: "I'm calling about a claim for my MRI. It was denied and I don't know why."
      - phase: intake
        to: bot
        step: claim_number
        say: "Yes, the claim number is seven zero, four one two."
      - phase: intake
        to: bot
        step: service_date
        say: "About a month ago, at Riverside Imaging Center."
      - phase: intake
        to: bot
        step: claim_concern
        say: "It was denied. The letter said something about no prior authorization."
      - phase: intake
        to: bot
        step: readback
        say: "Yes, that's right. Thank you."
        note: Hold music plays until the agent picks up. Keep saying hello until you hear them.
        expect:
          - {kind: queue, text: "The call rings in the portal: Maria Lopez, Verified chip, why she called"}
      - phase: agent
        to: agent
        say: "Hi, yes. So why did my MRI claim get denied?"
        if_asked:
          - "If the agent asks for the claim number: The claim number is seven zero, four one two."
          - "If the agent asks when or where: About a month ago, at Riverside Imaging Center."
          - "If the agent asks if your doctor got approval first: The office told me it was handled."
        agent_note: Wait for the hero, then answer in your own words. The hero's script is a guide, not a line to read.
        expect:
          - {kind: identity, text: "Caller panel: Maria Lopez, Evergreen HMO Silver, Verified"}
          - {kind: repeat_caller, text: "Repeat caller chip (two calls about this MRI in the last 30 days)"}
          - {kind: hero, id: "nbs:retro_auth_review:70412", text: "Hero, about 1 s after \"denied\": Start a retro authorization review for 70412"}
          - {kind: card, id: "card:denied_claim", text: "Denied claim tile: 70412, MRI, knee, left, CO-197"}
          - {kind: kb, id: KB-CL-002, via: hero_source, text: "Hero source names KB-CL-002 and KB-CL-009"}
      - phase: agent
        to: agent
        optional: true
        feature: tone_tip
        say: "This is my third call about this and nobody has fixed it. I'm really frustrated."
        note: Say it like you mean it. The tone reader goes by your words.
        expect:
          - {kind: tone_tip, text: "Tone tip tile: Acknowledge, then act (or Reassure first), and the mood chip moves to Frustrated or Worried"}
      - phase: agent
        to: agent
        optional: true
        feature: ask_bar
        say: "While I have you, was my office visit at Lakeside Family Medicine paid?"
        agent_note: "Press Cmd+K and type: show paid claims"
        expect:
          - {kind: ask, ask: show paid claims, id: "70358", text: "Ask bar answer tile: Claims, 70358 at Lakeside Family Medicine, paid, $25 member share"}
      - phase: agent
        to: agent
        say: "So what do I do now? Do I have to file an appeal?"
        if_asked:
          - "If the agent offers the retro review: Yes, please do that."
        expect:
          - {kind: plan, id: explain_status, via: agent_words, phrase: the reason, text: "Call plan ticks Explain the status when the agent explains it (\"the reason\", \"denied because\", \"no authorization\")"}
      - phase: closing
        to: agent
        say: "Okay, thank you. So I'll get a letter once the review is done?"
        if_asked:
          - "If the agent asks if there is anything else: No, that's all. Thank you."
        note: Say goodbye and wait for the agent to end the call.
        agent_note: Press Accept on the hero (Request retro auth review) before End, then End. Without the Accept the wrap up says no logged actions and the reason code falls back.
        expect:
          - {kind: plan, id: take_next_step, text: "Call plan ticks Take the next step on Accept"}
          - {kind: wrap_up, reason_code: appeal_started, refs: ["70412"], text: "Wrap up: Appeal or retro review started is suggested; the summary names 70412 and the retro authorization review"}

