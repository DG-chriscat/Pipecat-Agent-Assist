[project]
name = "pipecat-agent-assist"
version = "0.0.0"
description = "Deepgram Vitals: healthcare voice agent assist demo on Pipecat and Daily"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["server", "bot"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["server/tests", "bot/tests"]
# Makes the reusable live test harness importable as `harness`.
pythonpath = ["bot/tests"]
asyncio_mode = "auto"
markers = ["live: needs real Daily, Deepgram, or LLM keys (skipped by default)"]
addopts = "-m 'not live' --import-mode=importlib"
