# Use case pack: account and payments (PRD pack table "Account and payments").
# Format: docs/packs.md. Edit wording, triggers, cards, the call plan, or the next
# best step rules here; no code changes needed.
id: account_payments
name: Account and payments

identity:
  prompt: >-
    Ask for the caller's full name, date of birth, and member ID. You may ask for
    them together or one at a time. If something is unclear, ask them to repeat it
    once. The member ID looks like three letters and six digits, for example EVM100232.

reason:
  prompt: >-
    Ask, in one short question, what they are calling about today.

questions:
  - key: charge_date
    ask: About when was the charge you're calling about?
    description: >-
      The date or month of the charge in the caller's words, or "unknown".
  - key: charge_amount
    ask: And roughly how much was it?
    description: >-
      The amount the caller mentions, for example 610 dollars, or "unknown".
  - key: payment_concern
    ask: What went wrong with the payment, for example charged twice, wrong amount, or a refund you're waiting on?
    description: >-
      Short description of the problem, such as charged twice, wrong amount, or refund.

readback:
  prompt: >-
    Read back a short summary in one or two sentences: their name, why they called,
    and the charge details you have. Then ask if that is right. If they correct
    something, fix it and confirm.

# --- Assist (after handoff) ---------------------------------------------------------

triggers:
  phrases:
    - charged twice
    - double charge
    - double charged
    - charged me twice
    - two charges
    - duplicate charge
    - refund
    - premium
    - autopay
    - payment
    - my bill

allowed_connectors:
  - members
  - payments
  - kb_articles

keyterms:
  - EVM
  - PAY
  - Evergreen HMO Silver
  - Evergreen HMO Gold
  - Summit PPO Gold
  - Harbor EPO Bronze
  - Summit HDHP
  - Evergreen Medicare Advantage Plus
  - premium
  - autopay
  - refund
  - double charge
  - charged twice
  - draft
  - copay
  - deductible

card_templates:
  - id: payment_history
    type: record
    title: Payment history
    connector: payments
    fields: [payment_id, paid_at, amount, kind, method, status]
  # James Chen (EVM100232): two posted premium autopay drafts in the current month.
  - id: duplicate_charge
    type: alert
    title: Possible duplicate premium charge
    connector: payments
    search: {kind: premium}
    fields: [payment_id, paid_at, amount, method, status, reference]
    summary: "{payment_id} drafted {amount} on {paid_at}, a second premium this month"
    detect:
      kind: duplicate
      same: [kind, amount]
      date_field: paid_at
      period: month
      where: {kind: premium, status: posted}
  - id: billing_article
    type: article
    title: Knowledge base
    connector: kb_articles
    search: {category: billing}
    fields: [article_id, title, summary]

call_plan:
  - id: confirm_charges
    label: Confirm the charges on the account
    done_when:
      phrases: [i can see, i see two, i see the, both payments, two payments, two drafts]
  - id: explain_cause
    label: Explain what caused the charge
    done_when:
      phrases: [autopay, drafted twice, duplicate draft]
  - id: submit_refund
    label: Submit the refund request
    done_when:
      actions: [submit_premium_refund]
  - id: set_expectations
    label: Tell the caller when the refund posts
    done_when:
      phrases: [business days, posts back, back to your account]

next_best_steps:
  # James Chen, EVM100232: duplicate premium autopay draft this month.
  - id: duplicate_premium_refund
    priority: 10
    triggers:
      - charged twice
      - double charge
      - double charged
      - charged me twice
      - two charges
      - duplicate charge
      - refund
    required_facts:
      - payments.payment_id
      - payments.amount
      - payments.paid_at
      - payments.kind
    when: {payments.kind: premium}
    headline: Refund the duplicate premium draft {payments.payment_id}
    why: >-
      Autopay drafted the {payments.amount} premium twice this month. The second
      draft, {payments.payment_id} on {payments.paid_at}, is the duplicate.
    script: >-
      You're right, I can see your premium was drafted twice this month. I'm
      submitting a refund for the second charge of {payments.amount} now. It should
      post back to your account in 5 to 7 business days.
    action: {id: submit_premium_refund, label: Submit refund request}
    source: Billing system, KB-BL-001

# Wrap up (P3-5, AP-9): the reason codes the agent picks from after the call.
wrap_up:
  reason_codes:
    - code: payment_explained
      label: Payment explained
    - code: refund_submitted
      label: Refund submitted
      actions: [submit_premium_refund]
    - code: autopay_updated
      label: Autopay updated
    - code: callback_needed
      label: Callback needed
    - code: other
      label: Other
