[project]
name = "agent-assist-bot"
version = "0.0.0"
description = "Deepgram Vitals intake and listen-only assist bot (Pipecat)"
requires-python = ">=3.12"
dependencies = [
    # Includes Pipecat Flows as `pipecat.flows` (the standalone pipecat-ai-flows
    # package is deprecated and pinned to pipecat-ai<1.5).
    "pipecat-ai[daily,deepgram,anthropic,silero]==1.15.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_assist_bot"]
